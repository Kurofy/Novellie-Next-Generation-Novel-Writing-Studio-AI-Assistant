name: novellie
description: "Novellie — Create Your Own Novel"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  dio: ^5.4.3+1
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.6.0
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.3.0
  freezed_annotation: ^2.4.1
  go_router: ^14.2.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  json_annotation: ^4.9.0
  material_symbols_icons: ^4.2809.0
  path: ^1.9.0
  path_provider: ^2.1.3
  riverpod_annotation: ^2.3.5
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.5.24
  url_launcher: ^6.3.3
  uuid: ^4.4.0

dev_dependencies:
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
    - assets/icons/
    - assets/data/

  fonts:
    - family: Signika
      fonts:
        - asset: assets/fonts/Signika-VariableFont.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FAF9F4"
  adaptive_icon_foreground: "assets/brand/app_icon_adaptive_foreground.png"


